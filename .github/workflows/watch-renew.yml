name: Gmail Watch Renew

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  trigger-watch-renew:
    runs-on: ubuntu-latest
    steps:
      - name: Call watch-renew API
        run: |
          curl -sf -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://gmailm.autodesignlab.org/api/gmail/watch-renew"
